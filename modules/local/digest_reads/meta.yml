name: digest_reads
description: Digest long-read concatemers into monomers at restriction sites using seqkit.
keywords:
  - digest
  - pore-c
  - longc
  - restriction
  - monomers
tools:
  - seqkit:
      description: Ultrafast FASTA/Q toolkit
      homepage: https://bioinf.shenwei.me/seqkit/
input:
  - meta:
      type: map
      description: Sample metadata
  - reads:
      type: file
      description: Input reads (FASTQ or BAM)
  - cutter:
      type: string
      description: Restriction enzyme name (e.g. NlaIII)
output:
  digested_reads:
    - meta:
        type: map
    - "*.fastq.gz":
        type: file
        description: Digested monomer sequences in FASTQ format
