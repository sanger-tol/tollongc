name: pairtools_parse2
description: Convert BAM to pairs format using pairtools parse2 (single-end multi-contact, e.g. Pore-C).
keywords:
  - pairtools
  - parse2
  - pairs
  - pore-c
  - longc
tools:
  - pairtools:
      description: CLI tools to process mapped Hi-C data
      homepage: https://pairtools.readthedocs.io/
input:
  - meta:
      type: map
      description: Sample metadata
  - bam:
      type: file
      description: Annotated BAM
  - fasta:
      type: file
      description: Reference FASTA (for chromsizes via samtools faidx)
output:
  pairs:
    - meta:
        type: map
    - "*.pairs.gz":
        type: file
        description: Pairs format (gzipped)
  stats:
    - meta:
        type: map
    - "*.stats.txt":
        type: file
        description: Parse stats
  versions:
    - versions.yml:
        type: file
        description: Software versions
